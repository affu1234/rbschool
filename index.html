<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Sai Model School - 3D View</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #bfe6ff; }
  #wrap { position: fixed; inset: 0; }
  .title {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.75); color: #fff; padding: 10px 22px;
    border-radius: 12px; text-align: center; z-index: 2; pointer-events: none;
  }
  .title h1 { margin: 0; font-size: 22px; }
  .title p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 2;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
    background: #0284c7; color: #fff; font-weight: bold; font-size: 14px;
  }
  button:hover { background: #0369a1; }
</style>
</head>
<body>

<div id="wrap"></div>

<div class="title">
  <h1>Sri Sai Model School</h1>
  <p>Mouse drag: ghumayein &bull; Scroll: zoom karein</p>
</div>

<div class="controls">
  <button id="rotateBtn">Auto Rotate: Band</button>
  <button id="busBtn">Bus Chalao</button>
  <button id="resetBtn">Reset View</button>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // ---------- Scene ----------
  const wrap = document.getElementById('wrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe6ff);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
  const startPos = new THREE.Vector3(14, 7, 18);
  camera.position.copy(startPos);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 3, 0);
  controls.maxPolarAngle = Math.PI / 2 - 0.05; // zameen ke neeche na jaye
  controls.update();

  // ---------- Lights ----------
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(10, 20, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
  scene.add(sun);

  // ---------- Helper: box banane ka function ----------
  function box(w, h, d, color, x, y, z, parent = scene, opts = {}) {
    const mat = new THREE.MeshStandardMaterial({
      color, roughness: opts.roughness ?? 0.8, metalness: opts.metalness ?? 0.0
    });
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  // ---------- Zameen aur road ----------
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x84cc16 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Road (school ke saamne)
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 6),
    new THREE.MeshStandardMaterial({ color: 0x475569 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.01, 8.5);
  road.receiveShadow = true;
  scene.add(road);

  // Footpath
  box(80, 0.15, 1.6, 0xcbd5e1, 0, 0.08, 5.2);

  // ---------- School building ----------
  const school = new THREE.Group();
  scene.add(school);

  const FH = 1.6;           // ek floor ki height
  const FLOORS = 4;         // ground + 3 upar
  const H = FH * FLOORS;    // total height
  const MAIN_W = 6, MAIN_D = 4.5;

  // Main block (white)
  box(MAIN_W, H, MAIN_D, 0xf8fafc, 0, H / 2, 0, school);

  // Roof parapet
  box(MAIN_W + 0.2, 0.25, MAIN_D + 0.2, 0xe2e8f0, 0, H + 0.12, 0, school);

  // Brown vertical panels (photo jaisa)
  const panelColor = 0x8b7b72;
  [-2.9, -0.4].forEach(x => {
    box(0.6, H - 0.2, 0.1, panelColor, x, H / 2, MAIN_D / 2 + 0.02, school);
  });

  // Windows (front face)
  const winXs = [-2.4, -1.4, 1.2, 2.2];
  for (let f = 0; f < FLOORS; f++) {
    const y = f * FH + FH / 2;
    winXs.forEach(x => {
      box(0.82, 0.72, 0.06, 0xffffff, x, y, MAIN_D / 2 + 0.05, school);        // frame
      const glass = box(0.66, 0.56, 0.08, 0x1e3a5f, x, y, MAIN_D / 2 + 0.07, school, { roughness: 0.2, metalness: 0.5 });
    });
  }

  // Logo (kitab wala badge)
  const logoCircle = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 32),
    new THREE.MeshStandardMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
  );
  logoCircle.position.set(-0.1, 2.4, MAIN_D / 2 + 0.1);
  school.add(logoCircle);

  // Naam ka sign (roof ke neeche)
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 1024; signCanvas.height = 200;
  const g = signCanvas.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 1024, 200);
  g.fillStyle = '#111827';
  g.font = 'bold 84px Arial';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('SRI SAI MODEL SCHOOL', 512, 104);
  const signTex = new THREE.CanvasTexture(signCanvas);
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(3.8, 0.75),
    new THREE.MeshStandardMaterial({ map: signTex })
  );
  sign.position.set(-0.6, H - 0.6, MAIN_D / 2 + 0.12);
  school.add(sign);

  // Right wing (balconies wali side)
  const WING_X = 5.2, WING_W = 2.6;
  box(WING_W, H, MAIN_D, 0xf1f5f9, WING_X, H / 2, 0, school);
  box(WING_W + 0.2, 0.25, MAIN_D + 0.2, 0xe2e8f0, WING_X, H + 0.12, 0, school);
  for (let f = 1; f < FLOORS; f++) {
    const y = f * FH;
    // Balcony slab
    box(WING_W, 0.15, 1.0, 0xffffff, WING_X, y, MAIN_D / 2 + 0.5, school);
    // Railing
    box(WING_W, 0.5, 0.04, 0x334155, WING_X, y + 0.33, MAIN_D / 2 + 0.98, school);
    // Balcony ke peeche ka dark interior
    box(WING_W - 0.2, FH - 0.3, 0.1, 0x6b5b53, WING_X, y + FH / 2, MAIN_D / 2 + 0.03, school);
  }

  // Entrance portico
  const ENTRY_Z = MAIN_D / 2 + 0.9;
  box(2.6, 0.15, 1.6, 0x475569, 2.0, 2.2, ENTRY_Z, school);
  box(0.15, 2.0, 0.15, 0x334155, 0.8, 1.1, ENTRY_Z + 0.6, school);
  box(0.15, 2.0, 0.15, 0x334155, 3.2, 1.1, ENTRY_Z + 0.6, school);
  // Seedhiyan
  box(2.2, 0.15, 0.5, 0xd1d5db, 2.0, 0.08, ENTRY_Z + 1.0, school);

  // Gate (dark pillars + railing)
  const GATE_Z = 6.2;
  box(0.4, 1.4, 0.4, 0x1f2937, -3.5, 0.7, GATE_Z, scene);
  box(0.4, 1.4, 0.4, 0x1f2937, 6.5, 0.7, GATE_Z, scene);
  for (let x = -3.1; x < 6.2; x += 0.45) {
    box(0.08, 1.0, 0.08, 0x111827, x, 0.5, GATE_Z, scene);
  }

  // Hedges (hari jhaadiyan)
  for (let x = -2; x <= 6; x += 0.8) {
    const h = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x166534 })
    );
    h.position.set(x, 0.3, 5.0);
    h.castShadow = true;
    scene.add(h);
  }

  // ---------- Trees ----------
  function tree(x, z, s = 1) {
    const trunk = box(0.3 * s, 2 * s, 0.3 * s, 0x78350f, x, s, z);
    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(1.4 * s, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0x15803d })
    );
    crown.position.set(x, 2.8 * s, z);
    crown.castShadow = true;
    scene.add(crown);
  }
  tree(-9, 2, 1.2);
  tree(-12, -2, 1.0);
  tree(12, 1, 1.1);
  tree(15, -3, 1.3);

  // ---------- School bus ----------
  const bus = new THREE.Group();
  const yellow = new THREE.MeshStandardMaterial({ color: 0xfacc15 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1e293b });

  const busBody = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 1.4), yellow);
  busBody.position.set(0, 0.85, 0);
  busBody.castShadow = true;
  bus.add(busBody);

  const busWindows = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.4, 1.45), dark);
  busWindows.position.set(0, 1.3, 0);
  bus.add(busWindows);

  [-1.1, -0.1, 0.9].forEach(x => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.4, 1.46), yellow);
    w.position.set(x, 1.3, 0);
    bus.add(w);
  });

  [-1.0, 1.0].forEach(x => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.25, 16), dark);
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(x, 0.28, 0.75);
    wheel.castShadow = true;
    bus.add(wheel);
    const wheel2 = wheel.clone();
    wheel2.position.z = -0.75;
    bus.add(wheel2);
  });

  bus.position.set(-2, 0, 8.5);
  bus.rotation.y = Math.PI / 2;
  scene.add(bus);

  // ---------- Animation ----------
  let driving = false;
  let autoRotate = false;
  controls.autoRotateSpeed = 1.0;

  function animate() {
    requestAnimationFrame(animate);
    if (driving) {
      bus.position.x += 0.04;
      if (bus.position.x > 25) bus.position.x = -25;
    }
    controls.autoRotate = autoRotate;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Buttons ----------
  const rotateBtn = document.getElementById('rotateBtn');
  rotateBtn.addEventListener('click', () => {
    autoRotate = !autoRotate;
    rotateBtn.textContent = 'Auto Rotate: ' + (autoRotate ? 'Chalu' : 'Band');
  });

  const busBtn = document.getElementById('busBtn');
  busBtn.addEventListener('click', () => {
    driving = !driving;
    busBtn.textContent = driving ? 'Bus Roko' : 'Bus Chalao';
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    camera.position.copy(startPos);
    controls.target.set(0, 3, 0);
    controls.update();
  });

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
