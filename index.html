<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School 3D Project</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #1e293b;
    }
    #scene-container {
      width: 100%;
      height: 70vh;
    }
    section {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #1e293b;
      border-radius: 10px;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mera School 3D Project</h1>
    <p>3D object ko mouse se ghumayein</p>
  </header>

  <div id="scene-container"></div>

  <section>
    <h2>Project ke bare mein</h2>
    <p>Yahan apne topic ki jaankari likhein. Jaise is object ki pehchaan, kaam, aur khaas baatein.</p>
  </section>

  <footer>Banaya gaya: Aapka Naam | Class: ___</footer>

  <!-- Three.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls: mouse se ghumane ke liye -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const container = document.getElementById('scene-container');

    // Scene, camera, renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(
      60, container.clientWidth / container.clientHeight, 0.1, 1000
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Mouse se ghumane ke controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Roshni
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    // 3D object (abhi ek rotating cube, topic ke hisaab se badal sakte hain)
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
    const object = new THREE.Mesh(geometry, material);
    scene.add(object);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      object.rotation.x += 0.01;
      object.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Screen size badalne par adjust karein
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
